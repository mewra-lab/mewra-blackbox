name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # Chromium's sandbox needs user namespaces; 24.04 restricts unprofiled downloads.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm skills:verify
      - run: pnpm validate
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm test:browser
      - run: xvfb-run -a pnpm test:extension
      - run: pnpm package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mewra-blackbox-vsix
          path: mewra-blackbox.vsix
          retention-days: 7
